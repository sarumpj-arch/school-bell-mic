<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ประกาศเสียงตามสาย</title>
<style>
body{font-family:'Tahoma',sans-serif;background:#f3f4f8;display:flex;flex-direction:column;align-items:center;padding:30px 20px;margin:0}
.badge{background:white;border-radius:14px;padding:10px 18px;box-shadow:0 2px 6px rgba(0,0,0,.06);margin-bottom:40px;text-align:center}
.card{background:white;border-radius:20px;padding:24px;width:100%;max-width:380px;box-shadow:0 4px 14px rgba(0,0,0,.08);text-align:center}
.icon{width:64px;height:64px;background:#eef1ff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px}
h2{margin:4px 0}
p.sub{color:#9aa0ab;font-size:13px;margin-top:0}
.status{background:#eafaf1;color:#1e8449;border-radius:10px;padding:10px;font-size:13px;margin:14px 0}
input[type=password]{width:100%;box-sizing:border-box;padding:14px;border-radius:10px;border:1px solid #e2e4e9;text-align:center;letter-spacing:6px;font-size:20px;margin-bottom:14px}
button{width:100%;padding:14px;border:none;border-radius:10px;background:#5b3df5;color:white;font-size:16px;font-weight:bold;cursor:pointer}
.row{display:flex;align-items:center;gap:8px;font-size:13px;color:#555;margin-bottom:16px;justify-content:center}
.vol-row{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px}
input[type=range]{width:100%}
.switch-row{display:flex;justify-content:space-between;align-items:center;margin:18px 0;font-size:14px}
#chimeBtn{background:#e8820b;margin-bottom:28px}
#micBtn{width:140px;height:140px;border-radius:50%;background:#e4336a;margin:0 auto;display:block}
#micBtn.live{background:#c0265a;transform:scale(1.05)}
.foot{display:flex;justify-content:space-between;font-size:12px;color:#888;margin-top:24px}
#logoutBtn{color:#5b3df5;cursor:pointer;background:none;border:none;font-size:12px;width:auto;padding:0}
</style>
</head>
<body>
<div class="badge">📢 <b>ประกาศเสียงตามสาย</b><br><small id="roomLabel">ห้อง: -</small></div>

<div class="card" id="pinCard">
  <div class="icon">🔒</div>
  <h2>รหัสผ่านเข้าห้องประกาศ</h2>
  <p class="sub">กรอกรหัส PIN ที่กำหนดไว้ในคอมพิวเตอร์</p>
  <div class="status" id="pcStatus">🔄 กำลังตรวจสอบคอมพิวเตอร์...</div>
  <form id="loginForm">
    <input type="password" id="pin" maxlength="8" placeholder="••••">
    <div class="row"><input type="checkbox" id="remember" checked> จดจำรหัสผ่านในเครื่องนี้</div>
    <button type="submit">เข้าสู่ระบบ</button>
  </form>
  <div id="err" style="color:#e74c3c;font-size:13px;min-height:16px"></div>
</div>

<div class="card" id="micCard" style="display:none">
  <div class="status" id="statusText">พร้อมประกาศ</div>
  <div class="vol-row"><span>ระดับเสียงไมค์:</span><span id="volVal">100%</span></div>
  <input type="range" id="vol" min="0" max="100" value="100">
  <div class="switch-row"><span>โหมดแตะเปิด / แตะปิด</span>
    <label><input type="checkbox" id="tapMode"></label></div>
  <button id="chimeBtn">🔔 เล่นเสียงกริ่งเตือน</button>
  <button id="micBtn">🎙️<br>กดค้าง<br>เพื่อประกาศ</button>
  <div class="foot"><span id="countText">ผู้ประกาศในสาย: 0/2</span>
    <button id="logoutBtn">ออกจากระบบ</button></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const HOST = params.get('host');
const PORT = params.get('port') || '8080';
const ROOM = params.get('room') || '-';
let PIN = params.get('pin') || localStorage.getItem('sb_pin') || '';
document.getElementById('roomLabel').innerText = 'ห้อง: ' + ROOM;

if (!HOST) {
  document.getElementById('pcStatus').innerText = '❌ ไม่พบข้อมูลคอมพิวเตอร์ กรุณาสแกน QR Code จากโปรแกรมใหม่อีกครั้ง';
} else {
  document.getElementById('pcStatus').innerText = '🟢 พบคอมพิวเตอร์: ' + HOST;
}

function apiBase(){ return `https://${HOST}:${PORT}`; }
function wsUrl(){ return `wss://${HOST}:${PORT}/ws?pin=${encodeURIComponent(PIN)}&room=${encodeURIComponent(ROOM)}`; }

async function tryAutoLogin(){
  if (!PIN || !HOST) return;
  try{
    const res = await fetch(apiBase()+'/api/login', {method:'POST', body:new URLSearchParams({pin:PIN})});
    const data = await res.json();
    if (data.ok) showMicCard();
  }catch(e){ /* ยังไม่ได้ยืนยันใบรับรองความปลอดภัย */ }
}

document.getElementById('loginForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const pinVal = document.getElementById('pin').value;
  const remember = document.getElementById('remember').checked;
  try{
    const res = await fetch(apiBase()+'/api/login', {method:'POST', body:new URLSearchParams({pin:pinVal})});
    const data = await res.json();
    if (data.ok){
      PIN = pinVal;
      if (remember) localStorage.setItem('sb_pin', pinVal);
      showMicCard();
    } else {
      document.getElementById('err').innerText = data.error || 'รหัสผ่านไม่ถูกต้อง';
    }
  }catch(err){
    document.getElementById('err').innerText =
      'เชื่อมต่อคอมพิวเตอร์ไม่ได้ กรุณาเปิดลิงก์ยืนยันความปลอดภัยของคอม (ครั้งแรกเท่านั้น) แล้วลองใหม่';
  }
});

function showMicCard(){
  document.getElementById('pinCard').style.display = 'none';
  document.getElementById('micCard').style.display = 'block';
  connectWS();
  pollStatus();
  setInterval(pollStatus, 3000);
}

let mediaRecorder, ws, tapMode=false, holding=false;
const micBtn=document.getElementById('micBtn');
const vol=document.getElementById('vol');
vol.addEventListener('input', ()=>document.getElementById('volVal').innerText=vol.value+'%');

function connectWS(){ ws = new WebSocket(wsUrl()); }

async function startRecording(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRecorder = new MediaRecorder(stream, {mimeType:'audio/webm;codecs=opus'});
    mediaRecorder.ondataavailable = e => {
      if(e.data.size>0 && ws.readyState===1) e.data.arrayBuffer().then(b=>ws.send(b));
    };
    mediaRecorder.start(250);
    if(ws.readyState===1) ws.send(JSON.stringify({type:'start'}));
    micBtn.classList.add('live');
  }catch(err){ alert('ไม่สามารถเข้าถึงไมโครโฟนได้: '+err.message); }
}
function stopRecording(){
  if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
  if(ws && ws.readyState===1) ws.send(JSON.stringify({type:'stop'}));
  micBtn.classList.remove('live');
}
micBtn.addEventListener('mousedown', ()=>{ if(!tapMode) startRecording(); });
micBtn.addEventListener('mouseup', ()=>{ if(!tapMode) stopRecording(); });
micBtn.addEventListener('touchstart', e=>{ e.preventDefault(); if(!tapMode) startRecording(); });
micBtn.addEventListener('touchend', e=>{ e.preventDefault(); if(!tapMode) stopRecording(); });
micBtn.addEventListener('click', ()=>{
  if(tapMode){ holding=!holding; holding?startRecording():stopRecording(); }
});
document.getElementById('tapMode').addEventListener('change', e=>{ tapMode=e.target.checked; });
document.getElementById('chimeBtn').addEventListener('click', ()=>{
  fetch(apiBase()+'/api/chime?pin='+encodeURIComponent(PIN), {method:'POST'});
});
document.getElementById('logoutBtn').addEventListener('click', ()=>{
  localStorage.removeItem('sb_pin');
  location.reload();
});
async function pollStatus(){
  try{
    const r=await fetch(apiBase()+'/api/status'); const d=await r.json();
    document.getElementById('statusText').innerText = `พร้อมประกาศ (ว่าง ${d.max-d.connected}/${d.max})`;
    document.getElementById('countText').innerText = `ผู้ประกาศในสาย: ${d.connected}/${d.max}`;
  }catch(e){}
}

tryAutoLogin();
</script>
</body>
</html>
